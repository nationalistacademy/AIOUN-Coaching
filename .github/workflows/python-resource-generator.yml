name: Python Resource Generator QA

on:
  pull_request:
    paths:
      - "python-resource-generator/**"
      - ".github/workflows/python-resource-generator.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Python libraries
        run: python -m pip install -r python-resource-generator/requirements.txt
      - name: Run unit tests
        working-directory: python-resource-generator
        run: python -m unittest discover -s tests -v
