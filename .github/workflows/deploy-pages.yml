name: Deploy AIOU Coaching to GitHub Pages

on:
  workflow_run:
    workflows: ["Browser QA"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser assets
        run: npm install && npm run build:vendor
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='test-results/' \
            --exclude='scripts/' \
            --exclude='_site/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.js' \
            ./ _site/
          touch _site/.nojekyll
      - name: Inject Firebase web config when repository variables are configured
        env:
          FIREBASE_API_KEY: ${{ vars.AIOU_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.AIOU_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.AIOU_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.AIOU_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.AIOU_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.AIOU_FIREBASE_APP_ID }}
          FIREBASE_VAPID_KEY: ${{ vars.AIOU_FIREBASE_VAPID_KEY }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_AUTH_DOMAIN" ] && [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_APP_ID" ]; then
            mkdir -p _site/firebase
            node - <<'NODE'
            const fs = require('node:fs');
            const config = {
              apiKey: process.env.FIREBASE_API_KEY,
              authDomain: process.env.FIREBASE_AUTH_DOMAIN,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET || '',
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID || '',
              appId: process.env.FIREBASE_APP_ID,
              vapidKey: process.env.FIREBASE_VAPID_KEY || ''
            };
            fs.writeFileSync('_site/firebase/config.js', 'self.AIOU_FIREBASE_CONFIG = Object.freeze(' + JSON.stringify(config) + ');\\n');
            NODE
            echo "Firebase web config injected from repository variables."
          else
            echo "Firebase web config variables are incomplete; publishing safely disconnected Firebase UI."
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
