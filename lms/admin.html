<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching — Admin</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938;--soft:#fff1e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:90px;resize:vertical}.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#c2410c;border:1px solid #fed7aa}.row{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.badge{display:inline-flex;background:var(--soft);color:#c2410c;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.error{display:none;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;margin:12px 0}.success{display:none;background:#ecfdf5;color:#047857;padding:12px;border-radius:12px;margin:12px 0}@media(max-width:760px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top,.card{padding:16px}}</style></head><body><main class="wrap"><section class="top"><div><span class="badge">Admin / Teacher</span><h1>LMS Management</h1><p id="who" class="muted">Checking access…</p></div><button id="logout" class="btn secondary">Logout</button></section><div id="error" class="error"></div><div id="success" class="success"></div><section class="grid"><div class="card"><h2>Create Course</h2><div class="field"><label>Title</label><input id="courseTitle"></div><div class="field"><label>Slug</label><input id="courseSlug"></div><div class="field"><label>Description</label><textarea id="courseDescription"></textarea></div><button id="createCourse" class="btn">Create course</button></div><div class="card"><h2>Create Quiz</h2><div class="field"><label>Course</label><select id="courseSelect"></select></div><div class="field"><label>Quiz title</label><input id="quizTitle"></div><div class="field"><label>Description</label><textarea id="quizDescription"></textarea></div><label><input id="quizPublished" type="checkbox"> Publish immediately</label><div style="margin-top:12px"><button id="createQuiz" class="btn">Create quiz</button></div></div></section><section class="card" style="margin-top:16px"><h2>Add Quiz Question</h2><p class="muted">Correct answer stays in the private server-side key table and is never exposed to students.</p><div class="field"><label>Quiz</label><select id="quizSelect"></select></div><div class="field"><label>Question</label><textarea id="questionText"></textarea></div><div class="field"><label>Topic / subject area</label><input id="questionTopic" placeholder="e.g. Educational Psychology"></div><div class="field"><label>Options</label><textarea id="optionsText" placeholder="One option per line"></textarea></div><div class="field"><label>Correct option</label><select id="correctOption"></select></div><div class="field"><label>Points</label><input id="points" type="number" min="1" value="1"></div><button id="addQuestion" class="btn">Add question</button></section><section class="card" style="margin-top:16px"><h2>Existing Quizzes</h2><div id="quizList" class="muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(id,text){$(id).textContent=text;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}function options(){return $('optionsText').value.split('\n').map(x=>x.trim()).filter(Boolean)}function refreshCorrect(){const a=options();$('correctOption').innerHTML=a.map((x,i)=>`<option value="${esc(x)}">${i+1}. ${esc(x)}</option>`).join('')}async function auth(){const u=await supabase.auth.getUser();if(!u.data.user){location.replace('./signin-signup.html');return null}const p=await supabase.from('profiles').select('full_name').eq('id',u.data.user.id).single();$('who').textContent=u.data.user.email+(p.data?.full_name?' · '+p.data.full_name:'');return u.data.user}async function load(){const c=await supabase.from('courses').select('id,title').order('created_at',{ascending:false});if(c.error)throw c.error;$('courseSelect').innerHTML=(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');const q=await supabase.from('quizzes').select('id,title,course_id,published').order('created_at',{ascending:false});if(q.error)throw q.error;$('quizSelect').innerHTML=(q.data||[]).map(x=>`<option value="${x.id}">${esc(x.title)}${x.published?' — published':' — draft'}</option>`).join('');$('quizList').innerHTML=(q.data||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><div class="muted">${x.published?'Published':'Draft'}</div></div>`).join('')||'No quizzes yet.'}$('optionsText').addEventListener('input',refreshCorrect);$('createCourse').onclick=async()=>{try{const r=await supabase.from('courses').insert({title:$('courseTitle').value.trim(),slug:$('courseSlug').value.trim(),description:$('courseDescription').value.trim(),published:true}).select('id').single();if(r.error)throw r.error;msg('success','Course created.');await load()}catch(e){msg('error',e.message)}};$('createQuiz').onclick=async()=>{try{const r=await supabase.from('quizzes').insert({course_id:$('courseSelect').value,title:$('quizTitle').value.trim(),description:$('quizDescription').value.trim(),published:$('quizPublished').checked}).select('id').single();if(r.error)throw r.error;msg('success','Quiz created.');await load()}catch(e){msg('error',e.message)}};$('addQuestion').onclick=async()=>{try{const opts=options();if(!opts.length)throw Error('Add at least two options.');const r=await supabase.from('quiz_questions').insert({quiz_id:$('quizSelect').value,question:$('questionText').value.trim(),topic:$('questionTopic').value.trim()||null,options:opts,points:Number($('points').value)||1}).select('id').single();if(r.error)throw r.error;const k=await supabase.rpc('set_quiz_question_key',{p_question_id:r.data.id,p_correct_answer:$('correctOption').value});if(k.error)throw k.error;msg('success','Question and secure answer key added.');$('questionText').value='';$('optionsText').value='';refreshCorrect();await load()}catch(e){msg('error',e.message)}};$('logout').onclick=()=>supabase.auth.signOut().then(()=>location.replace('./signin-signup.html'));(async()=>{try{const u=await auth();if(u)await load()}catch(e){msg('error',e.message)}})();</script></body></html>
