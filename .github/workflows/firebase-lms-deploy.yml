name: Firebase LMS Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Type aioucoaching to confirm the Firebase project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-lms-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_project == 'aioucoaching' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/assignment-rich-editor-automation
      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Set repository Actions secret FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING to a service-account JSON for project aioucoaching before deploying."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install
          npm --prefix functions install
          npm install --global firebase-tools
      - name: Generate LMS Firebase Web App configuration from repository variables
        env:
          FIREBASE_API_KEY: ${{ vars.AIOU_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.AIOU_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ vars.AIOU_FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.AIOU_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.AIOU_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.AIOU_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.AIOU_FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.AIOU_FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          for name in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository variable AIOU_${name}"; exit 1; fi
          done
          node -e 'const fs=require("node:fs"); const c={apiKey:process.env.FIREBASE_API_KEY,authDomain:process.env.FIREBASE_AUTH_DOMAIN,databaseURL:process.env.FIREBASE_DATABASE_URL||"",projectId:process.env.FIREBASE_PROJECT_ID,storageBucket:process.env.FIREBASE_STORAGE_BUCKET||"",messagingSenderId:process.env.FIREBASE_MESSAGING_SENDER_ID||"",appId:process.env.FIREBASE_APP_ID,measurementId:process.env.FIREBASE_MEASUREMENT_ID||""}; fs.writeFileSync("firebase-lms/config.js","window.AIOU_FIREBASE_CONFIG = Object.freeze("+JSON.stringify(c)+");"+String.fromCharCode(10))'
      - name: Validate source and configuration
        run: |
          node --check functions/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('firebase.json','utf8')); JSON.parse(require('node:fs').readFileSync('firestore.indexes.json','utf8')); JSON.parse(require('node:fs').readFileSync('.firebaserc','utf8'))"
      - name: Deploy isolated LMS hosting and required Firebase backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --project aioucoaching --only hosting,functions,firestore:rules,firestore:indexes --non-interactive
      - name: Report deployed Hosting URL
        run: echo "Firebase Hosting default URL: https://aioucoaching.web.app"
