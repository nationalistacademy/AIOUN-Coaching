<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching LMS — Reset Password</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff6ef;font-family:Inter,system-ui,sans-serif;color:#171717}.box{width:min(430px,calc(100% - 32px));background:#fff;padding:28px;border-radius:22px;box-shadow:0 20px 60px #0001}h1{margin-top:0}.muted{color:#6c737b;font-size:14px;line-height:1.6}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:11px;margin:7px 0 14px;font:inherit}button{width:100%;border:0;border-radius:11px;padding:13px;background:#f67938;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:11px;border-radius:10px;background:#fff0e7;color:#8c3b13;font-size:14px}</style></head><body><main class="box"><h1>Set new password 🔐</h1><p class="muted">Apne LMS account ke liye naya password set karein.</p><form id="form"><input id="password" type="password" minlength="6" required placeholder="New password" autocomplete="new-password"><input id="confirm" type="password" minlength="6" required placeholder="Confirm password" autocomplete="new-password"><button>Update Password</button></form><div id="msg" class="msg" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY),msg=document.getElementById('msg');function show(t){msg.hidden=false;msg.textContent=t}supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')show('Recovery session ready. Apna naya password set karein.')});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value)return show('Passwords match nahi kar rahe.');const {error}=await supabase.auth.updateUser({password:p});if(error)return show(error.message);show('Password update ho gaya. Sign in page par ja rahe hain…');setTimeout(()=>location.href='./signin-signup.html',1200)};</script></body></html>
