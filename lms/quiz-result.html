<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching — Quiz Result</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.wrap{max-width:700px;margin:auto;padding:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center}.brand{color:#ea580c;font-weight:800}.score{font-size:48px;font-weight:900;margin:22px 0 4px}.muted{color:var(--muted);line-height:1.6}.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}a{padding:11px 15px;border-radius:11px;background:#f67938;color:#fff;text-decoration:none;font-weight:800}.secondary{background:#fff;color:#ea580c;border:1px solid #fed7aa}.error{display:none;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;margin-bottom:14px}</style></head><body><main class="wrap"><div id="error" class="error"></div><section class="panel"><div class="brand">AIOU COACHING LMS</div><h1>Quiz Submitted</h1><div id="score" class="score">—</div><p id="message" class="muted">Your attempt has been securely recorded. Results will appear here when the quiz is graded.</p><div class="links"><a href="./dashboard.html">Dashboard</a><a id="course" class="secondary" href="./dashboard.html">Back to course</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);const attemptId=new URLSearchParams(location.search).get('attempt');function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function init(){try{const u=await supabase.auth.getUser();if(!u.data.user){location.replace('./signin-signup.html');return}if(!attemptId)throw Error('Attempt not specified.');const r=await supabase.from('quiz_attempts').select('id,score,quiz_id,quizzes(course_id)').eq('id',attemptId).eq('student_id',u.data.user.id).single();if(r.error)throw r.error;if(r.data.score!==null){document.getElementById('score').textContent=String(r.data.score);document.getElementById('message').textContent='Your graded score is shown above.'}document.getElementById('course').href=`./course.html?id=${encodeURIComponent(r.data.quizzes?.course_id||'')}`}catch(e){fail(e.message||'Could not load result.')}}init();</script></body></html>
