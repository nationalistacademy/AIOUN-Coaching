<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching — Course</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938;--soft:#fff1e9}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:20px}.top,.panel,.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px}.top{padding:22px;margin-bottom:16px}.brand{color:#ea580c;font-weight:800;font-size:13px}.top h1{margin:7px 0}.muted{color:var(--muted)}.back{display:inline-block;margin-bottom:14px;color:#ea580c;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:16px}.panel{padding:20px}.lesson{padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}.lesson a{color:inherit;text-decoration:none;font-weight:750}.badge{display:inline-flex;background:var(--soft);color:#c2410c;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.error{display:none;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;margin-bottom:14px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.lesson{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><a class="back" href="./dashboard.html">← Dashboard</a><div id="error" class="error"></div><section class="top"><div class="brand">AIOU COACHING LMS</div><h1 id="title">Loading course…</h1><p id="description" class="muted"></p></section><section class="grid"><div class="panel"><h2>📖 Lessons</h2><div id="lessons" class="empty">Loading…</div></div><aside class="panel"><h2>📝 Quizzes</h2><div id="quizzes" class="empty">Loading…</div></aside></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function init(){try{const u=await supabase.auth.getUser();if(!u.data.user){location.replace('./signin-signup.html');return}if(!id)throw Error('Course not specified.');const c=await supabase.from('courses').select('id,title,description').eq('id',id).eq('published',true).single();if(c.error)throw c.error;const en=await supabase.from('enrollments').select('id').eq('course_id',id).eq('student_id',u.data.user.id).eq('status','active').maybeSingle();if(en.error)throw en.error;if(!en.data)throw Error('You are not enrolled in this course.');document.getElementById('title').textContent=c.data.title;document.getElementById('description').textContent=c.data.description||'Continue your course lessons and quizzes.';const [ls,qs]=await Promise.all([supabase.from('lessons').select('id,title,slug,sort_order').eq('course_id',id).eq('published',true).order('sort_order'),supabase.from('quizzes').select('id,title,description').eq('course_id',id).eq('published',true).order('created_at')]);if(ls.error)throw ls.error;if(qs.error)throw qs.error;document.getElementById('lessons').innerHTML=ls.data?.length?ls.data.map((l,i)=>`<div class="lesson"><div><span class="badge">Lesson ${i+1}</span><div><a href="./lesson.html?id=${encodeURIComponent(l.id)}">${esc(l.title)}</a></div></div><span class="muted">Open →</span></div>`).join(''):'<div class="empty">No published lessons yet.</div>';document.getElementById('quizzes').innerHTML=qs.data?.length?qs.data.map(q=>`<div class="lesson"><div><strong>${esc(q.title)}</strong><div class="muted">${esc(q.description||'Practice quiz')}</div></div><a href="./quiz.html?id=${encodeURIComponent(q.id)}">Start →</a></div>`).join(''):'<div class="empty">No quizzes yet.</div>'}catch(e){fail(e.message||'Could not load course.')}}init();</script></body></html>
