name: Firebase LMS Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: Type aioucoaching to confirm the Firebase project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-lms-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_project == 'aioucoaching' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/assignment-rich-editor-automation
      - name: Verify deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository Actions secret FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING. Add a service-account JSON for project aioucoaching before deploying."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm install --global firebase-tools
      - name: Inject Firebase Web API key from Actions variable
        env:
          AIOU_FIREBASE_API_KEY: ${{ vars.AIOU_FIREBASE_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'firebase-lms/config.js';
          const key = process.env.AIOU_FIREBASE_API_KEY;
          if (!key || !/^AIza[0-9A-Za-z_-]{20,}$/.test(key)) {
            throw new Error('Missing or invalid Actions variable AIOU_FIREBASE_API_KEY');
          }
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('"__FIREBASE_API_KEY__"')) {
            throw new Error('Firebase API key placeholder not found in config.js');
          }
          fs.writeFileSync(path, source.replace('"__FIREBASE_API_KEY__"', JSON.stringify(key)));
          console.log('Firebase Web API key injected from Actions variable');
          NODE
      - name: Validate Firebase web config, source and deployment files
        run: |
          node --check functions/index.js
          node --check firebase-lms/config.js
          node -e "JSON.parse(require('node:fs').readFileSync('firebase.json','utf8')); JSON.parse(require('node:fs').readFileSync('firestore.indexes.json','utf8')); JSON.parse(require('node:fs').readFileSync('.firebaserc','utf8')); const c=require('node:fs').readFileSync('firebase-lms/config.js','utf8'); for (const k of ['apiKey','authDomain','projectId','appId']) if (!c.includes(k + ': \\\"') || c.includes(k + ': \\\"\\\"')) throw new Error('Missing Firebase web config field: '+k); console.log('Firebase configuration files validated')"
      - name: Deploy isolated LMS hosting and required Firebase backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIOUCOACHING }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --project aioucoaching --only hosting,functions,firestore:rules,firestore:indexes,storage --non-interactive
      - name: Report deployed Hosting URL
        run: echo "Firebase Hosting default URL: https://aioucoaching.web.app"
