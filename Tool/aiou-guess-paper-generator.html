<style>

@media(max-width:500px){#ag-paper{zoom:.32}}
@media print{body *{visibility:hidden}#ag-paper,#ag-paper *{visibility:visible}#ag-paper{position:absolute;left:0;top:0;box-shadow:none;zoom:1!important}#ag-paper .ctl{display:none}}
</style>

<script>
//<![CDATA[
(function(){
var $=function(id){return document.getElementById('ag-'+id)};
var T={
ur:{selLang:'زبان منتخب کریں:',autoTotal:'نمبروں کا مجموعہ',fsize:'سوال کا سائز:',logo:'ہیڈر لوگو:',remove:'ہٹائیں',cancel:'منسوخ',wmTitle:'واٹر مارک',none:'کوئی نہیں',text:'ٹیکسٹ',image:'تصویر',wmUp:'واٹر مارک تصویر:',opacity:'دھندلاپن:',save:'محفوظ کریں',load:'محفوظ شدہ کھولیں',clear:'سب صاف کریں',level:'سطح',sem:'سیمسٹر',course:'پرچہ',total:'کل نمبر',time:'وقت',pass:'کامیابی کے نمبر',qno:'سوال نمبر',qs:'سوالات',marks:'نمبر',pdf:'PDF ڈاؤن لوڈ',word:'ورڈ ڈاؤن لوڈ',jpg:'JPEG ڈاؤن لوڈ',png:'PNG ڈاؤن لوڈ',print:'پرنٹ',addQ:'سوال شامل کریں',add:'شامل کریں',upd:'اپڈیٹ کریں',editQ:'سوال میں ترمیم',empty:'ابھی کوئی سوال شامل نہیں کیا گیا۔',needQ:'برائے مہربانی سوال لکھیں!',confirmClear:'کیا آپ تمام سوالات حذف کرنا چاہتے ہیں؟',saved:'محفوظ ہو گیا',noSave:'کوئی محفوظ شدہ پرچہ نہیں ملا۔',loaded:'پرچہ کھل گیا',wait:'براہ کرم انتظار کریں...',up:'اوپر',dn:'نیچے',ed:'ترمیم',rm:'حذف',
 ph:{univ:'یونیورسٹی کا نام',level:'سطح (مثلاً: بی اے)',sem:'سیمسٹر',course:'پرچہ / مضمون',total:'کل نمبر',pass:'کامیابی کے نمبر',time:'وقت',note:'ہدایات (نوٹ)',qText:'یہاں سوال لکھیں...',marks:'نمبر'},
 d:{univ:'علامہ اقبال اوپن یونیورسٹی اسلام آباد',level:'بی اے',sem:'بہار 2025',course:'معاشیات (402)',total:'100',pass:'40',time:'تین گھنٹے',note:'نوٹ: کوئی سے پانچ سوالات حل کریں۔ تمام سوالوں کے نمبر یکساں ہیں۔'}},
en:{selLang:'Select Medium:',autoTotal:'Sum of marks',fsize:'Question size:',logo:'Header Logo:',remove:'Remove',cancel:'Cancel',wmTitle:'Watermark',none:'None',text:'Text',image:'Image',wmUp:'Watermark image:',opacity:'Opacity:',save:'Save',load:'Load saved',clear:'Clear all',level:'Level',sem:'Semester',course:'Paper',total:'Total Marks',time:'Time',pass:'Passing Marks',qno:'Q. No.',qs:'Questions',marks:'Marks',pdf:'Download PDF',word:'Download Word',jpg:'Download JPEG',png:'Download PNG',print:'Print',addQ:'Add Question',add:'Add to Paper',upd:'Update',editQ:'Edit Question',empty:'No questions added yet.',needQ:'Please type a question!',confirmClear:'Delete all questions?',saved:'Saved',noSave:'No saved paper found.',loaded:'Paper loaded',wait:'Please wait...',up:'Up',dn:'Down',ed:'Edit',rm:'Delete',
 ph:{univ:'University name',level:'Level (e.g. BA)',sem:'Semester',course:'Paper / Subject',total:'Total Marks',pass:'Passing Marks',time:'Time Allowed',note:'Instructions (note)',qText:'Type your question here...',marks:'Marks'},
 d:{univ:'Allama Iqbal Open University Islamabad',level:'BA',sem:'Spring 2025',course:'Economics (402)',total:'100',pass:'40',time:'3 Hours',note:'Note: Attempt any five questions. All questions carry equal marks.'}}
};
var FIELDS={univ:'pUniv',level:'pLevel',sem:'pSem',course:'pCourse',total:'pTotal',pass:'pPass',time:'pTime'};
var IDS=['univ','level','sem','course','total','pass','time','noteIn','fs','wmTxt','wmOpacity'];
var lang='ur',logo=null,wmData=null,editIdx=-1;
var qs=[{t:'مکمل مقابلہ سے کیا مراد ہے؟ مکمل مقابلہ کے تحت فرم کا مختصر عرصہ میں توازن کا نقشہ فرضی اعداد و شمار کی مدد سے واضح کریں۔',m:'20'}];
var KEY='aiou_paper_v3';
function q1(s){return document.querySelector(s)}
function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2000)}
function loader(s){var l=$('loader');l.textContent=T[lang].wait;l.style.display=s?'flex':'none'}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function applyLang(l,keep){
  var prev=T[lang].d,L=T[l];lang=l;
  $('main').className='ag-wrap '+l;$('paper').className=l;
  qa('#ag-main [data-t]').forEach(function(e){e.textContent=L[e.getAttribute('data-t')]});
  qa('#ag-main [data-p]').forEach(function(e){e.placeholder=L.ph[e.getAttribute('data-p')]});
  Object.keys(L.d).forEach(function(k){var el=$(k==='note'?'noteIn':k);if(!keep&&(el.value===''||el.value===prev[k]))el.value=L.d[k]});
  refresh();
}
function refresh(){
  Object.keys(FIELDS).forEach(function(k){$(FIELDS[k]).textContent=$(k).value});
  $('pNote').textContent=$('noteIn').value;
  $('paper').style.setProperty('--fs',$('fs').value+'px');
  $('addTitle').textContent=editIdx>=0?T[lang].editQ:T[lang].addQ;
  $('addBtn').textContent=editIdx>=0?T[lang].upd:T[lang].add;
  $('cancelEdit').style.display=editIdx>=0?'':'none';
  renderQs();renderWM();
}
function renderQs(){
  var L=T[lang],b=$('qBody');b.textContent='';
  if(!qs.length){var r=mk('tr'),c=mk('td','ag-empty',L.empty);c.colSpan=3;r.appendChild(c);b.appendChild(r);return}
  qs.forEach(function(q,i){
    var tr=mk('tr'),td=mk('td','qx');
    tr.appendChild(mk('td','cn',String(i+1)));
    String(q.t).split('\n').forEach(function(line,j){if(j)td.appendChild(document.createElement('br'));td.appendChild(document.createTextNode(line))});
    var ctl=mk('span','ctl');
    [['up',L.up],['dn',L.dn],['ed',L.ed],['rm',L.rm]].forEach(function(a){var bt=mk('button','',a[1]);bt.type='button';bt.setAttribute('data-a',a[0]);bt.setAttribute('data-i',i);ctl.appendChild(bt)});
    td.appendChild(ctl);tr.appendChild(td);tr.appendChild(mk('td','cm',String(q.m)));b.appendChild(tr);
  });
}
$('qBody').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;if(!b)return;
  var i=parseInt(b.getAttribute('data-i'),10),a=b.getAttribute('data-a');
  if(a==='rm'){qs.splice(i,1);if(editIdx===i)editIdx=-1}
  else if(a==='up'){if(i>0){var t=qs[i-1];qs[i-1]=qs[i];qs[i]=t}}
  else if(a==='dn'){if(i<qs.length-1){var u=qs[i+1];qs[i+1]=qs[i];qs[i]=u}}
  else if(a==='ed'){editIdx=i;$('qText').value=qs[i].t;$('qMarks').value=qs[i].m;$('qText').focus()}
  refresh();
});
$('addBtn').onclick=function(){
  var t=$('qText').value.trim();if(!t){alert(T[lang].needQ);return}
  var q={t:t,m:$('qMarks').value};
  if(editIdx>=0){qs[editIdx]=q;editIdx=-1}else qs.push(q);
  $('qText').value='';refresh();
};
$('cancelEdit').onclick=function(){editIdx=-1;$('qText').value='';refresh()};
$('autoTotal').onclick=function(){$('total').value=qs.reduce(function(s,q){return s+(parseFloat(q.m)||0)},0);refresh()};
function readImg(f,cb){if(!f)return;var r=new FileReader();r.onload=function(e){cb(e.target.result)};r.readAsDataURL(f)}
$('logoFile').onchange=function(e){readImg(e.target.files[0],function(d){logo=d;setLogo()})};
$('logoClear').onclick=function(){logo=null;$('logoFile').value='';setLogo()};
function setLogo(){
  $('pLogo').src=logo||'';$('pLogo').style.display=logo?'block':'none';
  $('logoThumb').src=logo||'';$('logoThumb').style.display=logo?'inline-block':'none';
  $('logoClear').style.display=logo?'':'none';
}
$('wmFile').onchange=function(e){readImg(e.target.files[0],function(d){wmData=d;renderWM()})};
function renderWM(){
  var type=q1('input[name="ag-wm"]:checked').value,w=$('wm');
  $('wmText').style.display=type==='text'?'flex':'none';
  $('wmImg').style.display=type==='image'?'flex':'none';
  $('wmOp').style.display=type==='none'?'none':'flex';
  w.style.opacity=$('wmOpacity').value;w.textContent='';
  if(type==='text'){w.appendChild(mk('div','t',$('wmTxt').value))}
  else if(type==='image'&&wmData){var im=document.createElement('img');im.src=wmData;im.alt='';w.appendChild(im)}
}
IDS.forEach(function(id){$(id).addEventListener('input',refresh)});
qa('input[name="ag-wm"]').forEach(function(r){r.onchange=refresh});
qa('input[name="ag-lang"]').forEach(function(r){r.onchange=function(){applyLang(r.value)}});
function save(silent){
  try{
    var v={};IDS.forEach(function(k){v[k]=$(k).value});
    localStorage.setItem(KEY,JSON.stringify({lang:lang,logo:logo,wmData:wmData,qs:qs,v:v,wm:q1('input[name="ag-wm"]:checked').value}));
    if(!silent)toast(T[lang].saved);$('saveInfo').textContent=new Date().toLocaleTimeString();
  }catch(e){if(!silent)toast('Storage error')}
}
function load(silent){
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s){if(!silent)toast(T[lang].noSave);return false}
  logo=s.logo;wmData=s.wmData;qs=s.qs||[];
  Object.keys(s.v).forEach(function(k){$(k).value=s.v[k]});
  q1('input[name="ag-wm"][value="'+s.wm+'"]').checked=true;
  q1('input[name="ag-lang"][value="'+s.lang+'"]').checked=true;
  setLogo();applyLang(s.lang,true);if(!silent)toast(T[lang].loaded);return true;
}
$('saveBtn').onclick=function(){save()};$('loadBtn').onclick=function(){load()};
$('clearBtn').onclick=function(){if(confirm(T[lang].confirmClear)){qs=[];editIdx=-1;refresh();save(true)}};
setInterval(function(){save(true)},15000);
function makeCanvas(){
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  return ready.then(function(){
    var wrap=document.createElement('div');
    wrap.style.cssText='position:absolute;left:-9999px;top:0;background:#fff';
    var c=$('paper').cloneNode(true);
    c.removeAttribute('id');c.style.cssText='zoom:1;box-shadow:none;margin:0;width:794px;min-height:1123px;padding:57px';
