name = "aiou-coaching-tools"
main = "worker.js"
compatibility_date = "2026-10-31"

# Deploy this Worker from the worker/ directory.
# Runtime secrets are configured in Cloudflare, never committed here:
#   npx wrangler secret put OLLAMA_API_KEY
#   npx wrangler secret put AUTH_TOKEN
#
# Optional runtime variables (Cloudflare Settings > Variables):
#   OLLAMA_MODEL = "glm-5.3"
#   ALLOWED_ORIGINS = "https://aioucoaching.blogspot.com,https://aioucoaching.netlify.app"
#   AI_TIMEOUT_MS = "120000"
