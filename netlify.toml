# Netlify deployment for the static AIOU Coaching web app.
# The repository does not contain real Firebase credentials; configure those
# in the app's own supported setup before enabling Firebase-backed features.

[build]
  command = "npm install --omit=dev && npm run build:vendor"
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
