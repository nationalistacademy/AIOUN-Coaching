# Browser QA is the canonical test workflow for this static site.
# Keep this legacy matrix workflow manual-only to avoid duplicate failing CI runs.
name: Node.js CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical test workflow
        run: |
          echo "Use the Browser QA workflow for responsive, link, PWA and export tests."
          echo "This repository has no package-lock.json, so the old npm-cache matrix workflow was not valid.";
