<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
.acp-ui{--ag-p:var(--jt-primary,#f67938);--ag-ph:var(--jt-btn-primary-hover,#f46013);--ag-glass:rgba(255,255,255,.55);--ag-soft:rgba(255,255,255,.4);--ag-bd:rgba(255,255,255,.7);--ag-sh:0 8px 32px rgba(0,0,0,.1);max-width:960px;margin:0 auto 24px;font-size:14px;line-height:1.5;color:inherit;direction:ltr;text-align:left}
.dark-mode .acp-ui{--ag-glass:rgba(30,30,35,.55);--ag-soft:rgba(30,30,35,.4);--ag-bd:rgba(255,255,255,.1);--ag-sh:0 8px 32px rgba(0,0,0,.4)}
.acp-ui *{box-sizing:border-box}
.acp-card{background:var(--ag-glass);-webkit-backdrop-filter:blur(15px) saturate(180%);backdrop-filter:blur(15px) saturate(180%);border:1px solid var(--ag-bd);border-radius:20px;box-shadow:var(--ag-sh);padding:18px;margin-bottom:16px}
.acp-card h3{margin:0 0 12px!important;padding:0 0 6px!important;font-size:16px!important;font-weight:700;border-bottom:3px solid var(--ag-p);display:inline-block}
.acp-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.acp-row .full{grid-column:1/-1}
.acp-ui label{display:block;font-size:12px;font-weight:700;opacity:.8;margin:0 0 3px;cursor:pointer}
.acp-ui input[type=text],.acp-ui input[type=number],.acp-ui select{width:100%;padding:9px 12px;border:1px solid var(--ag-bd);border-radius:14px;font:inherit;background:var(--ag-soft);color:inherit;margin:0}
.acp-ui input:focus,.acp-ui select:focus{outline:2px solid var(--ag-p);outline-offset:1px}
.acp-ui select option{color:#222}
.acp-ui input[type=range]{accent-color:var(--ag-p);width:100%}
.acp-ui input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--ag-bd);border-radius:14px;background:var(--ag-soft);cursor:pointer}
.acp-chk{display:flex!important;align-items:center;gap:6px;font-size:13px!important;opacity:1!important}
.acp-chk input{accent-color:var(--ag-p)}
.acp-btn{padding:10px 22px;border:1px solid transparent;border-radius:999px;color:#fff;background:var(--ag-p);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(246,121,56,.3);transition:transform .2s,background-color .2s}
.acp-btn:hover{background:var(--ag-ph);transform:translateY(-1px)}
.acp-btn:focus-visible{outline:3px solid var(--ag-p);outline-offset:2px}
.acp-btn.gray{background:var(--ag-soft);color:inherit;border-color:var(--ag-bd);box-shadow:none}
.acp-btn.gray:hover{background:var(--ag-p);color:#fff}
.acp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.acp-tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.acp-tp{border:2px solid var(--ag-bd);border-radius:14px;padding:6px;background:var(--ag-soft);cursor:pointer;text-align:center;font:inherit;font-size:12px;font-weight:700;color:inherit}
.acp-tp svg{display:block;width:100%;height:auto;background:#fff;border-radius:6px;margin-bottom:4px}
.acp-tp.on{border-color:var(--ag-p);box-shadow:0 0 0 2px var(--ag-p)}
.acp-stage{background:rgba(0,0,0,.1);border-radius:20px;padding:14px 8px;overflow:hidden}
.acp-holder{margin:0 auto;position:relative}
#acp-busy{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);color:#fff;font:bold 20px Arial;align-items:center;justify-content:center;z-index:99999}
.acp-pg{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;color:var(--tc,#000);transform-origin:top left;font-family:var(--ff,'Times New Roman',serif);box-shadow:0 4px 20px rgba(0,0,0,.3);line-height:1.25;direction:ltr;text-align:left}
.acp-pg *{box-sizing:border-box;margin:0;padding:0}
.acp-pg .acp-decor{position:absolute;left:0;top:0;width:794px;height:1123px}
.acp-pg .acp-in{position:absolute;left:0;top:0;width:794px;height:1123px;display:flex;flex-direction:column;align-items:center;padding:78px 29px 0}
.acp-pg .acp-logo{width:310px;height:auto;max-width:none;border-radius:0;object-fit:fill;margin-bottom:62px}
.acp-pg .acp-tb{width:100%;border:2px solid var(--ln,#000)}
.acp-pg .acp-r{display:grid;grid-template-columns:42% 58%;border-top:2px solid var(--ln,#000);min-height:var(--rh,74px)}
.acp-pg .acp-r:first-child{border-top:0}
.acp-pg .acp-r div{display:flex;align-items:center;font-weight:700;font-size:var(--fs,30px);padding:6px 14px;word-break:break-word}
.acp-pg .acp-r div:first-child{padding-left:54px}
.acp-pg .acp-r div+div{border-left:2px solid var(--ln,#000)}
.acp-pg .acp-tb.rounded{border-radius:20px;overflow:hidden}
.acp-pg .acp-tb.fill .acp-r>div:first-child{background:var(--lb)}
.acp-pg .acp-tb.line{border-left:0;border-right:0}
.acp-pg .acp-tb.line .acp-r div+div{border-left:0}
.acp-pg .acp-uni{margin-top:56px;font-size:30px;font-style:italic;font-weight:700;text-align:center}
.acp-pg .acp-sem{margin-top:22px;font-size:23px;font-style:italic;font-weight:700;text-align:center}
@media print{body *{visibility:hidden}#acp-paper,#acp-paper *{visibility:visible}#acp-paper{position:fixed;left:0;top:0;transform:none!important;box-shadow:none}@page{size:A4;margin:0}}
</style>

  <div class="acp-card">

    <h3 style="margin-top:18px">Customize</h3>
    <div class="acp-row">
      <div><label for="c-c1">Main colour</label><input type="color" id="c-c1" value="#ff26ac"></div>
      <div><label for="c-c2">Second colour</label><input type="color" id="c-c2" value="#000000"></div>
      <div><label for="c-tc">Text colour</label><input type="color" id="c-tc" value="#000000"></div>
      <div><label for="c-ln">Table line colour</label><input type="color" id="c-ln" value="#000000"></div>
      <div><label for="c-ff">Font</label><select id="c-ff"><option value="'Times New Roman',Times,serif">Times New Roman</option><option value="Georgia,serif">Georgia</option><option value="Arial,Helvetica,sans-serif">Arial</option><option value="'Trebuchet MS',sans-serif">Trebuchet</option><option value="'Courier New',monospace">Courier New</option></select></div>
      <div><label for="c-ts">Table style</label><select id="c-ts"><option value="">Classic grid</option><option value="rounded">Rounded</option><option value="fill">Tinted labels</option><option value="rounded fill">Rounded + tinted</option><option value="line">Lines only</option></select></div>
      <div><label for="c-fs">Table text size: <span id="c-fsv">30</span>px</label><input type="range" id="c-fs" min="20" max="38" value="30"></div>
      <div><label for="c-rh">Row height: <span id="c-rhv">74</span>px</label><input type="range" id="c-rh" min="56" max="96" value="74"></div>
    </div>
  </div>
  <div class="acp-card">
    <div class="acp-btns" style="margin-top:0">
      <button type="button" class="acp-btn" id="c-pdf">Download PDF</button>
      <button type="button" class="acp-btn" id="c-jpg">Download JPG</button>

      <button type="button" class="acp-btn gray" id="c-print">Print</button>
      <button type="button" class="acp-btn gray" id="c-reset">Reset</button>
    </div>
