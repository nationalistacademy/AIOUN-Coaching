<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIOU Coaching LMS — Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938;--brand2:#ea580c;--soft:#fff1e9;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.wrap{max-width:1180px;margin:auto;padding:22px;visibility:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;box-shadow:0 12px 35px #0000000a}.brand{font-weight:800;color:var(--brand2);font-size:14px}.top h1{margin:3px 0 4px;font-size:28px}.muted{color:var(--muted)}.logout,.primary{border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.logout:disabled{opacity:.6;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.stat,.panel,.course,.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:18px}.stat strong{display:block;font-size:27px;margin-top:4px}.layout{display:grid;grid-template-columns:1.6fr .9fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h2{margin:0 0 14px;font-size:19px}.courses{display:grid;gap:12px}.course{padding:16px}.course-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.course h3{margin:0 0 5px;font-size:17px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:12px;font-weight:800}.course p{margin:9px 0;color:var(--muted);line-height:1.5}.progress{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}.course-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}.lessons{display:grid;gap:9px;margin-top:12px}.lesson{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.lesson-title{font-weight:700}.lesson small{color:var(--muted)}.complete{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.complete.done{background:#ecfdf3;color:var(--ok);border-color:#bbf7d0}.announcement{padding:12px 0;border-bottom:1px solid var(--line)}.announcement:last-child{border-bottom:0}.announcement b{display:block;margin-bottom:4px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #d1d5db;border-radius:14px}.error{margin-top:14px;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;display:none}.loading{color:var(--muted)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.top h1{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
<section class="top">
<div><div class="brand">AIOU COACHING LMS</div><h1 id="welcome">Student Dashboard</h1><div class="muted" id="email"></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="primary" href="./practice.html" style="display:inline-block;text-decoration:none">Practice Hub</a><a class="primary" href="./progress.html" style="display:inline-block;text-decoration:none;background:#fff1e9;color:#9a3412">My Progress</a></div>
<button class="logout" id="logout" type="button">Logout</button>
</section>
<div id="error" class="error"></div>
<section class="stats">
<div class="stat"><span class="muted">Enrolled courses</span><strong id="courseCount">0</strong></div>
<div class="stat"><span class="muted">Completed lessons</span><strong id="lessonCount">0</strong></div>
<div class="stat"><span class="muted">Overall progress</span><strong id="progressCount">0%</strong></div>
</section>
<section class="layout">
<div class="panel"><h2>📚 My Courses</h2><div id="courses" class="courses"><div class="loading">Loading your courses…</div></div></div>
<aside class="panel"><h2>📢 Announcements</h2><div id="announcements"><div class="loading">Loading announcements…</div></div></aside>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);
const signInPath='./signin-signup.html';
const app=document.querySelector('.wrap');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentUser=null;
let progressRows=[];

function showError(message){const el=document.getElementById('error');el.textContent=message;el.style.display='block'}
function hideError(){document.getElementById('error').style.display='none'}
function progressForLesson(id){return progressRows.find(x=>x.lesson_id===id)?.completed===true}

async function loadDashboard(){
  hideError();
  const [enrollRes,progressRes,courseRes,announceRes]=await Promise.all([
    supabase.from('enrollments').select('id,course_id,status,enrolled_at').eq('student_id',currentUser.id).neq('status','cancelled'),
    supabase.from('lesson_progress').select('lesson_id,completed').eq('student_id',currentUser.id),
    supabase.from('courses').select('id,title,slug,description,thumbnail_url,published').eq('published',true).order('created_at',{ascending:false}),
    supabase.from('course_announcements').select('id,course_id,title,body,created_at').eq('published',true).order('created_at',{ascending:false}).limit(8)
  ]);
  for(const result of [enrollRes,progressRes,courseRes,announceRes])if(result.error)throw result.error;
  const enrollments=enrollRes.data||[]; progressRows=progressRes.data||[]; const courses=courseRes.data||[]; const announcements=announceRes.data||[];
  const enrolledIds=new Set(enrollments.map(x=>x.course_id));
  document.getElementById('courseCount').textContent=enrollments.length;
  document.getElementById('lessonCount').textContent=progressRows.filter(x=>x.completed).length;
  renderAnnouncements(announcements, courses);
  await renderCourses(courses.filter(c=>enrolledIds.has(c.id)), enrollments);
  const allLessons=await getLessonCounts(courses.filter(c=>enrolledIds.has(c.id)).map(c=>c.id));
  const total=allLessons.reduce((n,x)=>n+x.total,0), done=progressRows.filter(x=>x.completed).length;
  document.getElementById('progressCount').textContent=total?Math.round(done/total*100)+'%':'0%';
}

async function getLessonCounts(courseIds){
  if(!courseIds.length)return [];
  const {data,error}=await supabase.from('lessons').select('id,course_id,title,slug,sort_order,published').in('course_id',courseIds).eq('published',true).order('sort_order');
  if(error)throw error;
  return courseIds.map(id=>{const lessons=(data||[]).filter(x=>x.course_id===id);return {id,total:lessons.length,lessons}});
}

async function renderCourses(courses,enrollments){
  const box=document.getElementById('courses');
  if(!courses.length){box.innerHTML='<div class="empty">You have no active course enrollment yet.</div>';return}
  const groups=await getLessonCounts(courses.map(c=>c.id));
  box.innerHTML=groups.map(group=>{
    const c=courses.find(x=>x.id===group.id); const done=group.lessons.filter(l=>progressForLesson(l.id)).length; const pct=group.total?Math.round(done/group.total*100):0;
    return `<article class="course"><div class="course-head"><div><span class="badge">${esc(enrollments.find(e=>e.course_id===c.id)?.status||'active')}</span><h3>${esc(c.title)}</h3></div><span class="muted">${pct}%</span></div><p>${esc(c.description||'Continue your AIOU Coaching lessons and track your progress here.')}</p><div class="progress"><i style="width:${pct}%"></i></div><div class="course-foot"><span class="muted">${done}/${group.total} lessons completed</span></div><div class="lessons">${group.lessons.length?group.lessons.map(l=>`<div class="lesson"><div><div class="lesson-title">${esc(l.title)}</div><small>Lesson ${Number(l.sort_order)+1}</small></div><button class="complete ${progressForLesson(l.id)?'done':''}" data-lesson="${l.id}" type="button">${progressForLesson(l.id)?'✓ Completed':'Mark complete'}</button></div>`).join(''):'<div class="empty">No published lessons yet.</div>'}</div></article>`;
  }).join('');
  box.querySelectorAll('[data-lesson]').forEach(btn=>btn.addEventListener('click',()=>toggleLesson(btn.dataset.lesson,btn)));
}

function renderAnnouncements(items,courses){
  const box=document.getElementById('announcements');
  if(!items.length){box.innerHTML='<div class="empty">No announcements yet.</div>';return}
  box.innerHTML=items.map(a=>{const course=courses.find(c=>c.id===a.course_id);return `<div class="announcement"><b>${esc(a.title)}</b><div class="muted">${esc(course?.title||'Course')} · ${new Date(a.created_at).toLocaleDateString()}</div><p>${esc(a.body)}</p></div>`}).join('');
}

async function toggleLesson(lessonId,button){
  button.disabled=true;
  const completed=button.classList.contains('done');
  const payload={student_id:currentUser.id,lesson_id:lessonId,completed:!completed,completed_at:completed?null:new Date().toISOString()};
  try{
    const {error}=await supabase.from('lesson_progress').upsert(payload,{onConflict:'student_id,lesson_id'});
    if(error)throw error;
    await loadDashboard();
  }catch(error){showError(error.message||'Could not update lesson progress.');button.disabled=false}
}

async function initializeDashboard(){
  try{
    const {data,error}=await supabase.auth.getUser();
    if(error||!data.user){location.replace(signInPath);return}
    currentUser=data.user;
    document.getElementById('email').textContent=currentUser.email||'';
    document.getElementById('welcome').textContent='Welcome, '+(currentUser.user_metadata?.full_name||'Student')+' 👋';
    app.style.visibility='visible';
    await loadDashboard();
  }catch(error){app.style.visibility='visible';showError(error.message||'Could not load your LMS data.')}
}

supabase.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')location.replace(signInPath)});
document.getElementById('logout').onclick=async()=>{const button=document.getElementById('logout');button.disabled=true;button.textContent='Signing out…';try{const {error}=await supabase.auth.signOut();if(error)throw error;location.replace(signInPath)}catch(error){button.disabled=false;button.textContent='Logout';showError(error.message||'Sign out failed. Please try again.')}};
initializeDashboard();
</script>
</body>
</html>
