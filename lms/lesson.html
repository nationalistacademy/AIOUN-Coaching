<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching — Lesson</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}.back{color:#ea580c;text-decoration:none;font-weight:800}.muted{color:var(--muted)}h1{font-size:30px}.content{line-height:1.8;white-space:pre-wrap}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#111;margin:15px 0}.btn{border:0;background:var(--brand);color:#fff;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.btn.done{background:#15803d}.error{display:none;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;margin:12px 0}@media(max-width:600px){.wrap{padding:12px}h1{font-size:24px}.panel{padding:18px}}</style></head><body><main class="wrap"><a class="back" id="back" href="./dashboard.html">← Back</a><div id="error" class="error"></div><article class="panel"><div class="muted" id="course"></div><h1 id="title">Loading…</h1><iframe id="video" class="video" hidden allowfullscreen></iframe><div id="content" class="content"></div><button id="complete" class="btn" type="button">Mark complete</button></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);const id=new URLSearchParams(location.search).get('id');let user,done=false;function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function init(){try{const u=await supabase.auth.getUser();if(!u.data.user){location.replace('./signin-signup.html');return}user=u.data.user;if(!id)throw Error('Lesson not specified.');const r=await supabase.from('lessons').select('id,title,content,video_url,course_id,courses(title)').eq('id',id).eq('published',true).single();if(r.error)throw r.error;document.getElementById('title').textContent=r.data.title;document.getElementById('course').textContent=r.data.courses?.title||'AIOU Coaching';document.getElementById('content').textContent=r.data.content||'';document.getElementById('back').href=`./course.html?id=${encodeURIComponent(r.data.course_id)}`;if(r.data.video_url){const v=document.getElementById('video');v.src=r.data.video_url;v.hidden=false}const p=await supabase.from('lesson_progress').select('completed').eq('student_id',user.id).eq('lesson_id',id).maybeSingle();if(p.error)throw p.error;done=p.data?.completed===true;render();document.getElementById('complete').onclick=toggle}catch(e){fail(e.message||'Could not load lesson.')}}function render(){const b=document.getElementById('complete');b.textContent=done?'✓ Completed — Mark incomplete':'Mark complete';b.classList.toggle('done',done)}async function toggle(){const b=document.getElementById('complete');b.disabled=true;try{const next=!done;const r=await supabase.from('lesson_progress').upsert({student_id:user.id,lesson_id:id,completed:next,completed_at:next?new Date().toISOString():null},{onConflict:'student_id,lesson_id'});if(r.error)throw r.error;done=next;render()}catch(e){fail(e.message||'Could not update progress.')}finally{b.disabled=false}}init();</script></body></html>
