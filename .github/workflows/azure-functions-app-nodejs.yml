# This is an optional template only. It must never deploy automatically.
# No Azure hosting is configured or authorized for this repository.
name: Deploy Node.js project to Azure Function App (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type AZURE_DEPLOY to acknowledge this optional deployment workflow"
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ inputs.confirm == 'AZURE_DEPLOY' && false }}
    runs-on: ubuntu-latest
    steps:
      - name: Deployment intentionally disabled
        run: |
          echo "Azure deployment is disabled until a real app name, budget and explicit approval are provided."
          exit 1
