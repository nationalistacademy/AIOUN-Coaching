<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOU Coaching — Quiz</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--brand:#f67938;--soft:#fff1e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.panel,.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.top{margin-bottom:14px}.muted{color:var(--muted)}.q{margin-top:12px}.q h3{margin-top:0}.option{display:block;padding:10px;border:1px solid var(--line);border-radius:11px;margin:8px 0;cursor:pointer}.option:hover{background:var(--soft)}.submit{margin-top:16px;border:0;background:var(--brand);color:#fff;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6}.error{display:none;background:#fef2f2;color:#b91c1c;padding:12px;border-radius:12px;margin:12px 0}.back{color:#ea580c;text-decoration:none;font-weight:800}.badge{display:inline-flex;background:var(--soft);color:#c2410c;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}@media(max-width:600px){.wrap{padding:12px}.panel,.q{padding:16px}}</style></head><body><main class="wrap"><a class="back" id="back" href="./dashboard.html">← Back</a><div id="error" class="error"></div><section class="panel top"><span class="badge">Quiz</span><h1 id="title">Loading…</h1><p id="description" class="muted"></p><div id="status" class="muted"></div></section><form id="quiz"></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>const supabase=window.supabase.createClient(window.AIOU_SUPABASE_URL,window.AIOU_SUPABASE_PUBLISHABLE_KEY);const id=new URLSearchParams(location.search).get('id');let user,questions=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}function options(v){if(Array.isArray(v))return v.map((x,i)=>({value:typeof x==='string'?x:(x.value??x.id??i),label:typeof x==='string'?x:(x.label??x.text??x.value??`Option ${i+1}`)}));if(v&&typeof v==='object')return Object.entries(v).map(([k,x])=>({value:k,label:String(x)}));return []}async function init(){try{const u=await supabase.auth.getUser();if(!u.data.user){location.replace('./signin-signup.html');return}user=u.data.user;if(!id)throw Error('Quiz not specified.');const q=await supabase.from('quizzes').select('id,title,description,course_id').eq('id',id).eq('published',true).single();if(q.error)throw q.error;document.getElementById('title').textContent=q.data.title;document.getElementById('description').textContent=q.data.description||'Answer all questions and submit your attempt.';document.getElementById('back').href=`./course.html?id=${encodeURIComponent(q.data.course_id)}`;const qs=await supabase.from('quiz_questions').select('id,question,options,sort_order,points').eq('quiz_id',id).order('sort_order');if(qs.error)throw qs.error;questions=qs.data||[];if(!questions.length){document.getElementById('quiz').innerHTML='<div class="panel muted">No questions have been added yet.</div>';return}document.getElementById('quiz').innerHTML=questions.map((q,i)=>`<fieldset class="q"><h3>${i+1}. ${esc(q.question)}</h3>${options(q.options).map(o=>`<label class="option"><input required type="radio" name="q_${q.id}" value="${esc(o.value)}"> ${esc(o.label)}</label>`).join('')}</fieldset>`).join('')+'<button class="submit" type="submit">Submit quiz</button>'}catch(e){fail(e.message||'Could not load quiz.')}}document.getElementById('quiz').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('.submit');button.disabled=true;try{const answers=questions.map(q=>({question_id:q.id,answer:document.querySelector(`input[name="q_${q.id}"]:checked`)?.value??null}));const result=await supabase.rpc('submit_quiz_attempt',{p_quiz_id:id,p_answers:answers});if(result.error)throw result.error;const row=Array.isArray(result.data)?result.data[0]:result.data;if(!row?.attempt_id)throw Error('Quiz submission failed.');location.replace(`./quiz-result.html?attempt=${encodeURIComponent(row.attempt_id)}`)}catch(e){fail(e.message||'Could not submit quiz. Please try again.');button.disabled=false}});init();</script></body></html>
